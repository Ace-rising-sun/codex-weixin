<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信 Codex</title>
<style>
:root{color-scheme:light dark;font:14px/1.6 system-ui,sans-serif}body{margin:0;color:var(--color-text-primary,CanvasText);background:transparent}main{max-width:720px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 14px}section{padding:24px 0;border-bottom:1px solid color-mix(in srgb,currentColor 16%,transparent)}label{display:grid;gap:6px;margin:12px 0}input,textarea,select,button{font:inherit;color:inherit}input,textarea,select{box-sizing:border-box;width:100%;border:1px solid color-mix(in srgb,currentColor 24%,transparent);border-radius:9px;padding:9px 12px;background:transparent}textarea{min-height:88px;resize:vertical}button{cursor:pointer;border:1px solid color-mix(in srgb,currentColor 24%,transparent);border-radius:9px;padding:8px 14px;background:transparent}button.primary{background:#167548;color:white;border-color:transparent}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{opacity:.7;font-size:13px}#notice{display:block;min-height:24px;white-space:pre-wrap;overflow-wrap:anywhere}#qr{background:white;border-radius:12px;max-width:100%;width:240px;display:block;margin:16px auto}#account{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0 0 16px}#account dt{opacity:.7}#account dd{margin:0;overflow-wrap:anywhere;user-select:text}#login-panel{text-align:center}#pin-form{max-width:260px;margin:12px auto}.task{padding:12px 0;border-top:1px solid color-mix(in srgb,currentColor 12%,transparent)}.task p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer}a{color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #218759;outline-offset:2px}[hidden]{display:none!important}@media(max-width:480px){main{padding:16px}.grid{grid-template-columns:1fr}}
</style></head><body><main>
<header><h1>微信 Codex</h1><span id="connection" role="status">正在读取状态</span></header>
<output id="notice" aria-live="polite"></output>
<section><h2>微信连接</h2><dl id="account" hidden><dt>绑定用户标识</dt><dd id="account-user"></dd><dt>ClawBot 标识</dt><dd id="account-bot"></dd></dl><p class="muted">使用本人微信扫码连接自己的 ClawBot。支持本人私聊文字、图片、语音、视频与文件。</p><div class="row"><button class="primary" id="login">扫码连接</button><button id="reconnect">重新连接</button><button id="logout">断开微信</button></div>
<div id="login-panel" hidden><img id="qr" alt="微信绑定二维码"><p id="login-status"></p><form id="pin-form" hidden><label>手机显示的验证码<input id="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,12}" required></label><button class="primary">提交验证码</button></form><button id="cancel">取消扫码</button></div></section>
<section><h2>执行设置</h2><form id="settings"><label>工作目录<input id="workspace" required spellcheck="false"></label><div class="grid"><label>独立模型<input id="model" required spellcheck="false" maxlength="128"></label><label>推理强度<select id="effort"><option>low</option><option>medium</option><option>high</option><option>xhigh</option></select></label></div><div class="grid"><label>执行权限<select id="sandbox"><option value="read-only">只读，额外权限需审批</option><option value="workspace-write">允许工作目录内写入</option></select></label><label>单轮时限（分钟，0 表示不限）<input id="timeout" type="number" min="0" max="1440" step="1" required></label></div><div class="grid"><label>单个附件上限（MB）<input id="max-media" type="number" min="1" max="100" step="1" required></label></div><p class="muted">语音回复以 MP3 音频附件发送，并保留文字内容。入站语音在本机识别，首次使用会下载识别模型。</p><label>回复风格<textarea id="persona" maxlength="4000"></textarea></label><p class="muted">额外权限请求会发到微信，由你用批准码确认。设置保存后对后续任务生效。</p><button class="primary" id="save">保存设置</button></form></section>
<section><header><h2>任务记录</h2><button id="stop">停止当前任务</button></header><div id="tasks"></div></section>

<p class="muted">微信命令支持 /help、/status、/stop、/new、/history、/approve 和 /reject。</p>
</main><script>
const $ = id => document.getElementById(id);
const pending = new Map();let sequence=0;let loaded=false;let refreshing=false;let destroyed=false;
function request(method,params){return new Promise((resolve,reject)=>{const id=++sequence;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('请求超时，请稍后重试'));},45000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.jsonrpc!=='2.0')return;const p=pending.get(event.data.id);if(!p)return;pending.delete(event.data.id);clearTimeout(p.timer);event.data.error?p.reject(new Error('宿主请求失败')):p.resolve(event.data.result);});
async function tool(name,args={}){const result=await request('tools/call',{name,arguments:args});if(result.isError)throw new Error(result.content?.[0]?.text||'操作失败');return result.structuredContent;}
function notice(text){$('notice').textContent=text;}
function render(data){
 $('connection').textContent=data.connected?'已连接':data.bound?'已绑定，等待连接':'尚未绑定';
 $('account').hidden=!data.account;
 $('account-user').textContent=data.account?.userId||'';
 $('account-bot').textContent=data.account?.botId||'';
 if(!loaded){const s=data.settings;for(const key of ['workspace','model','effort','persona','sandbox'])$(key).value=s[key];$('timeout').value=s.timeoutMinutes;$('max-media').value=s.maxMediaMb;loaded=true;}
 const login=data.login;$('login-panel').hidden=!login?.active;$('login').disabled=Boolean(login?.active)||data.bound;
 if(login?.image&&login.image.startsWith('data:image/png;base64,'))$('qr').src=login.image;
 $('pin-form').hidden=!login?.active||!login.status.includes('need_verifycode');
 $('login-status').textContent=login?.status?.includes('need_verifycode')?'请输入手机微信显示的验证码':login?.status==='scaned'?'已扫码，请在手机上确认':'请使用本人微信扫码确认';
 if(login&&!login.active&&['expired','failed','verify_code_blocked','binded_redirect'].includes(login.status))notice(({expired:'二维码已过期，请重新点击扫码连接',failed:'扫码连接失败，请检查微信提示',verify_code_blocked:'验证码校验受限，请稍后重试',binded_redirect:'此机器人已有绑定，请先核对微信中的连接'})[login.status]);
 $('stop').disabled=!data.current;
 $('tasks').replaceChildren();for(const task of data.tasks){const box=document.createElement('div');box.className='task';const title=document.createElement('p');title.textContent=task.title;const state=document.createElement('span');state.className='muted';state.textContent=({pending:'排队中',running:'执行中',completed:'已结束',failed:'执行失败',interrupted:'已中断，请核实后重新派任务'})[task.status]||task.status;if(task.delivery==='unknown')state.textContent+=' · 微信投递未确认';if(task.delivery==='partial')state.textContent+=' · 部分附件未确认或失败';box.append(title,state);for(const output of task.outputs||[]){const media=document.createElement('p');media.className='muted';media.textContent=(output.name||output.kind)+' · '+({pending:'待发送',sending:'正在提交',sent:'已提交发送',failed:'发送失败',unknown:'投递未确认'}[output.delivery]||output.delivery);box.append(media);}if(task.result){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='查看结果';const result=document.createElement('p');result.textContent=task.result;details.append(summary,result);box.append(details);}$('tasks').append(box);}if(!data.tasks.length)$('tasks').textContent='暂无任务。';

 if(data.lastError)notice(data.lastError);
}
async function refresh(){if(refreshing||destroyed)return;refreshing=true;try{render(await tool('weixin.status'));}catch(error){notice(error.message);}finally{refreshing=false;}}
async function act(button,name,args={}){button.disabled=true;notice('');try{const result=await tool(name,args);if(result?.settings)render(result);if(result?.message)notice(result.message);await refresh();}catch(error){notice(error.message);}finally{button.disabled=false;}}
$('login').onclick=()=>act($('login'),'weixin.login');$('cancel').onclick=()=>act($('cancel'),'weixin.cancelLogin');$('reconnect').onclick=()=>act($('reconnect'),'weixin.reconnect');$('stop').onclick=()=>act($('stop'),'weixin.stop');
$('logout').onclick=()=>{if(confirm('断开微信并移除本机登录凭证？历史会话保留。'))void act($('logout'),'weixin.logout');};
$('pin-form').onsubmit=async event=>{event.preventDefault();const button=event.submitter;await act(button,'weixin.pin',{pin:$('pin').value});$('pin').value='';};
$('settings').onsubmit=async event=>{event.preventDefault();await act($('save'),'weixin.settings.save',{workspace:$('workspace').value,model:$('model').value,effort:$('effort').value,sandbox:$('sandbox').value,persona:$('persona').value,timeoutMinutes:Number($('timeout').value),maxMediaMb:Number($('max-media').value)});};
(async()=>{try{await request('ui/initialize',{appInfo:{name:'codex-weixin',version:'0.4.0'},appCapabilities:{},protocolVersion:'2026-01-26'});window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');await refresh();setInterval(refresh,3000);}catch(error){notice(error.message);}})();
window.addEventListener('pagehide',()=>{destroyed=true;});
</script></body></html>
